<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img" aria-label="Ebco — Simplifying lives.">
  <title>Ebco — Simplifying lives.</title>
  <!-- Brand colors: Ebco Blue #003DA5, Ebco Orange #F47920 -->
  <g fill="none" stroke="none">
    <!-- Oval outline -->
    <ellipse cx="150" cy="62" rx="140" ry="55" fill="#ffffff" stroke="#003DA5" stroke-width="7"/>
    <!-- Wordmark "ebco" -->
    <text x="150" y="88"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="86" font-weight="700" letter-spacing="-3"
          text-anchor="middle" fill="#003DA5">ebco</text>
    <!-- Registered trademark -->
    <g transform="translate(272,16)">
      <circle cx="0" cy="0" r="9" fill="none" stroke="#003DA5" stroke-width="2"/>
      <text x="0" y="4" font-family="Arial, sans-serif" font-size="10" font-weight="700"
            text-anchor="middle" fill="#003DA5">R</text>
    </g>
    <!-- Tagline -->
    <text x="150" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="24" font-style="italic" font-weight="600" text-anchor="middle">
      <tspan fill="#003DA5">Simplifying </tspan><tspan fill="#F47920">lives.</tspan>
    </text>
  </g>
</svg>
